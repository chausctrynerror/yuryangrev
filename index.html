<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>決戰洞庭湖畔</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #e67e22;
            --accent-color: #c0392b;
            --success-color: #27ae60;
            --bg-color: #1e272e;
            --card-bg: #f5f6fa;
            --text-color: #2f3640;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: #fff;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
            background: #dcdde1;
            color: var(--text-color);
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 4px solid #718093;
        }
        header {
            background: var(--primary-color);
            color: #fff;
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid #fbc531;
        }
        header h1 {
            font-size: 26px;
            margin-bottom: 6px;
        }
        header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .content {
            padding: 25px;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        .welcome-box {
            text-align: center;
        }
        .welcome-box h2 {
            color: var(--primary-color);
            margin-bottom: 15px;
        }
        .form-group {
            margin: 20px 0;
        }
        .form-group label {
            font-weight: bold;
            font-size: 16px;
            display: block;
            margin-bottom: 8px;
        }
        .form-group input {
            padding: 10px 15px;
            font-size: 16px;
            width: 100%;
            max-width: 350px;
            border: 2px solid #718093;
            border-radius: 6px;
            outline: none;
        }
        .monster-select {
            display: flex;
            justify-content: center;
            margin-top: 25px;
        }
        .monster-btn {
            background-color: #2f3640;
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 8px rgba(0,0,0,0.2);
            border: 2px solid #fbc531;
        }
        .monster-btn:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }
        .alert {
            color: var(--accent-color);
            font-weight: bold;
            margin-top: 8px;
            min-height: 22px;
        }

        /* 對戰視圖 */
        .battle-field {
            background: #e4f1fe;
            border: 3px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            min-height: 120px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .battle-status {
            background: rgba(255,255,255,0.95);
            border: 2px solid #333;
            border-radius: 6px;
            padding: 10px 15px;
            width: 44%;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }
        .battle-status h4 {
            font-size: 16px;
            margin-bottom: 4px;
            color: #2c3e50;
        }
        .hp-bar-container {
            background: #ccc;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #333;
            margin-top: 5px;
        }
        .hp-bar {
            background: var(--success-color);
            height: 100%;
            width: 100%;
            transition: width 0.3s;
        }
        
        /* 寶可夢佈局：左下題目，右下4個選項 */
        .ui-box-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .question-box {
            background: #fff;
            border: 3px solid #2c3e50;
            border-radius: 8px;
            padding: 18px;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        .question-meta {
            font-size: 13px;
            color: #7f8c8d;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
        .question-text {
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
            margin-top: 6px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
        }
        .option-btn {
            background: #34495e;
            color: white;
            border: 3px solid #2c3e50;
            border-radius: 8px;
            padding: 12px 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            box-shadow: 0 3px 5px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .option-btn:hover {
            background: #2980b9;
            transform: scale(1.02);
        }

        /* 結算畫面 */
        .result-card {
            background: #fff;
            color: #333;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            border: 3px solid #2c3e50;
        }
        .cartoon-avatar {
            font-size: 60px;
            margin-bottom: 10px;
        }
        .result-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .result-title.fail { color: var(--accent-color); }
        .result-title.hard { color: var(--secondary-color); }
        .result-title.easy { color: var(--success-color); }

        .result-desc {
            font-size: 16px;
            color: #555;
            margin-bottom: 20px;
        }
        .review-list {
            text-align: left;
            margin-top: 25px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 10px;
        }
        .review-item {
            background: #f1f2f6;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 5px solid #ccc;
            font-size: 14px;
        }
        .review-item.correct { border-left-color: var(--success-color); }
        .review-item.incorrect { border-left-color: var(--accent-color); }
        .btn-restart {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .btn-restart:hover {
            background-color: #34495e;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>決戰洞庭湖畔</h1>
            <p>中四級《岳陽樓記》文言精粹與寫作手法實戰考驗</p>
        </header>
        <div class="content">
            
            <!-- 首頁選擇怪獸 -->
            <div id="screen-home" class="screen active">
                <div class="welcome-box">
                    <h2>決戰洞庭湖畔</h2>
                    <p style="margin-bottom: 15px; color: #555;">勇敢的朱石麟戰士啊！岳陽樓樓主正在洞庭湖掀起濁浪！<br>每次對戰將從 100 道題庫中隨機抽選 30 題，若答錯 5 次你將會力竭倒下。展現你的文言實力，擊敗守護怪吧！</p>
                    <div class="form-group">
                        <label for="player-name">請輸入朱石麟戰士姓名：</label>
                        <input type="text" id="player-name" placeholder="例如：周承志" autocomplete="off">
                        <div id="name-alert" class="alert"></div>
                    </div>
                    <div class="monster-select">
                        <button class="monster-btn" type="button" onclick="startBattle()">挑戰「岳陽樓樓主」<br><small style="font-size:13px; font-weight:normal; opacity:0.9;">（100題庫隨機抽選30題）</small></button>
                    </div>
                </div>
            </div>

            <!-- 對戰畫面 -->
            <div id="screen-quiz" class="screen">
                <div class="battle-field">
                    <div class="battle-status">
                        <h4 id="player-status-name">朱石麟戰士</h4>
                        <div>錯失次數: <span id="wrong-count" style="color:var(--accent-color); font-weight:bold;">0</span> / 5</div>
                        <div class="hp-bar-container"><div id="player-hp" class="hp-bar"></div></div>
                    </div>
                    <div class="battle-status" style="text-align: right;">
                        <h4>岳陽樓樓主</h4>
                        <div>剩餘題目: <span id="ques-remaining">30</span> 題</div>
                        <div class="hp-bar-container"><div id="monster-hp" class="hp-bar"></div></div>
                    </div>
                </div>

                <div class="ui-box-container">
                    <div class="question-box">
                        <div class="question-meta">
                            <span id="question-counter">題目 1 / 30</span>
                            <span id="timer-display" style="color: #2980b9; font-weight:bold;">用時：00:00</span>
                        </div>
                        <div class="question-text" id="ui-question-content">題目載入中...</div>
                    </div>
                    <div class="options-grid" id="ui-options-container"></div>
                </div>
            </div>

            <!-- 結算畫面 -->
            <div id="screen-result" class="screen">
                <div class="result-card">
                    <div class="cartoon-avatar" id="result-avatar">🛌</div>
                    <div class="result-title" id="result-title">中道崩殂</div>
                    <p class="result-desc" id="result-desc">你未能堅持到最後，被怪物擊敗了。</p>
                    <div style="font-size: 18px; font-weight: bold; margin-bottom: 5px;" id="result-score-text">答對題數：0 / 30 題</div>
                    <div style="font-size: 15px; color: #e67e22; font-weight: bold;" id="result-time-text">總用時：0分0秒</div>
                    
                    <button class="btn-restart" type="button" onclick="goToHome()">再來一次</button>

                    <div class="review-section">
                        <h3 style="color: #2c3e50; margin-bottom: 10px;">答題檢討與正確答案</h3>
                        <div class="review-list" id="review-list"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // 100道精編題庫資料
        const masterBank = [
            {q: "《岳陽樓記》的作者是北宋哪一位著名政治家兼文學家？", options: ["范仲淹", "歐陽修", "司馬光", "王安石"], ans: 0, correctText: "范仲淹"},
            {q: "《岳陽樓記》是在宋仁宗哪一年號期間寫成的？", options: ["元豐五年", "熙寧二年", "慶曆四年", "紹興三年"], ans: 2, correctText: "慶曆四年"},
            {q: "滕子京因甚麼原因被貶官到巴陵郡擔任知州？", options: ["被誣陷挪用公款遭貶官", "推行變法失敗主動辭職", "科舉考試失利調任地方", "因年老體衰退居二線"], ans: 0, correctText: "被誣陷挪用公款遭貶官"},
            {q: "范仲淹寫作《岳陽樓記》時，身處哪裏擔任地方官？", options: ["杭州", "鄧州", "蘇州", "潁州"], ans: 1, correctText: "鄧州"},
            {q: "《岳陽樓記》中文體「記」在古代屬於甚麼文體範疇？", options: ["純粹客觀記載歷史的史書", "抒發男女相思情感的詩賦", "兼具山水遊記與雜記並重議論", "專門向皇帝進諫的奏摺文"], ans: 2, correctText: "兼具山水遊記與雜記並重議論"},
            {q: "古代「記」類文章的特點是甚麼？", options: ["融記事、寫景、抒情、議論於一體", "只記錄地理方位與建築數據", "只表達孤芳自賞的個人情緒", "只以押韻為主的駢體辭賦"], ans: 0, correctText: "融記事、寫景、抒情、議論於一體"},
            {q: "《岳陽樓記》第一段中的哪兩個字是全篇文章的「眼目」？", options: ["勝狀", "謫守", "大觀", "大宴"], ans: 1, correctText: "謫守"},
            {q: "范仲淹死後的諡號是甚麼？", options: ["文忠", "文安", "文達", "文正"], ans: 3, correctText: "文正"},
            {q: "《岳陽樓記》收錄於下列哪一部文集？", options: ["《歐陽文忠公集》", "《范文正公集》", "《臨川先生文集》", "《元豐類稿集》"], ans: 1, correctText: "《范文正公集》"},
            {q: "范仲淹在北宋時期曾主持過哪一次著名的政治改革？", options: ["王安石變法", "慶曆新政", "戊戌變法", "元祐更化"], ans: 1, correctText: "慶曆新政"},
            {q: "「越明年，政通人和，百廢具興」中「越明年」的意思是甚麼？", options: ["過了五年之後的時間", "經過第二年（到了第二年）", "第二年越過邊界出征", "明年超越了所有前人"], ans: 1, correctText: "經過第二年（到了第二年）"},
            {q: "「政通人和，百廢具興」這句話在文中主要說明甚麼？", options: ["滕子京卓越的治理政績", "朝廷國庫十分充裕富有", "巴陵郡商業非常發達熱鬧", "百姓普遍熱愛遊山玩水"], ans: 0, correctText: "滕子京卓越的治理政績"},
            {q: "滕子京重修岳陽樓時，「增其舊制」是指甚麼？", options: ["完全推倒舊樓重建新樓", "制定新的參觀管理制度", "擴大原有的建築規模格局", "大幅縮減岳陽樓的面積"], ans: 2, correctText: "擴大原有的建築規模格局"},
            {q: "「屬予作文以記之」一句中，省略了甚麼句子成分？", options: ["賓語「岳陽樓」", "主語「滕子京」", "介詞「在」或「於」", "謂語動詞「寫」"], ans: 1, correctText: "主語「滕子京」"},
            {q: "「予觀夫巴陵勝狀，在洞庭一湖」中「勝狀」的意思是甚麼？", options: ["優美壯麗的景色", "戰勝敵人的捷報", "超越前人的體制", "盛大的宴會場面"], ans: 0, correctText: "優美壯麗的景色"},
            {q: "文中描寫洞庭湖「銜遠山，吞長江」，運用了甚麼修辭手法？", options: ["借代與借喻修辭", "反覆與設問修辭", "擬人（比擬）與對偶", "白描與雙關修辭"], ans: 2, correctText: "擬人（比擬）與對偶"},
            {q: "「朝暉夕陰，氣象萬千」主要形容洞庭湖甚麼特點？", options: ["早晚景色的千變萬化", "降雨量極為豐富充沛", "氣溫急劇下降變寒冷", "湖泊四周植物繁茂生長"], ans: 0, correctText: "早晚景色的千變萬化"},
            {q: "作者在第2段寫「前人之述備矣」，其主要用意是甚麼？", options: ["批評前人的詩賦寫得不好", "說明無須再重複描寫名勝景色", "感嘆自己文采不如前人好", "表明自己沒有親眼看過景"], ans: 1, correctText: "說明無須再重複描寫名勝景色"},
            {q: "第2段中哪一句話在全文結構上具有「承上啟下」的作用？", options: ["覽物之情，得無異乎？", "此則岳陽樓之大觀也", "政通人和，百廢具興", "屬予作文以記之矣"], ans: 0, correctText: "覽物之情，得無異乎？"},
            {q: "「然則北通巫峽，南極瀟湘」一句在結構上的承上作用是甚麼？", "options": ["承接首段滕子京的政績表述", "開啟下文古仁人胸襟的闡釋", "承接上文洞庭湖地理景觀描寫", "總結全文抒發政治抱負理念"], ans: 2, correctText: "承接上文洞庭湖地理景觀描寫"},
            {q: "「若夫霪雨霏霏，連月不開」中「霪雨」是指甚麼？", options: ["猛烈短暫的雷陣雨", "夾雜冰雹的大風雨", "連綿不斷的陰雨", "清晨飄落的濛濛細雨"], ans: 2, correctText: "連綿不斷的陰雨"},
            {q: "「日星隱耀，山岳潛形」描寫了陰雨天甚麼特徵？", options: ["太陽與星星美麗耀眼", "高山峻嶺顯得格外巍峨", "暴風雨已經徹底停息了", "天色昏暗，天地一片模糊"], ans: 3, correctText: "天色昏暗，天地一片模糊"},
            {q: "「商旅不行，檣傾楫摧」中的「檣」和「楫」分別指甚麼？", options: ["船的桅杆和船槳", "船的帆布和船錨", "商人的貨物和錢財", "碼頭的欄杆和石階"], ans: 0, correctText: "船的桅杆和船槳"},
            {q: "作者以「商旅不行，檣傾楫摧」來描寫惡劣天氣，屬於甚麼手法？", options: ["正面直接細緻描寫", "側面描寫（間接描寫）", "純粹動態聽覺描寫", "客觀統計數據羅列"], ans: 1, correctText: "側面描寫（間接描寫）"},
            {q: "「薄暮冥冥，虎嘯猿啼」中的「薄暮」意思是甚麼？", options: ["清晨太陽初升時", "深夜萬籟俱寂時", "傍晚、黃昏時分", "正午陽光熾熱時"], ans: 2, correctText: "傍晚、黃昏時分"},
            {q: "「薄暮冥冥，虎嘯猿啼」渲染了陰雨天時岳陽樓怎樣的氣氛？", options: ["蕭瑟、淒涼、陰暗", "熱鬧喧嘩、生機勃勃", "溫馨祥和、如沐春風", "恬靜舒適、悠然自得"], ans: 0, correctText: "蕭瑟、淒涼、陰暗"},
            {q: "遷客騷人在陰雨天氣登上岳陽樓，會產生甚麼心情？", options: ["心曠神怡，寵辱皆忘，其喜洋洋", "去國懷鄉，憂讒畏譏，感極而悲", "不以物喜，不以己悲，處之泰然", "超脫得失，專注欣賞湖面風光"], ans: 1, correctText: "去國懷鄉，憂讒畏譏，感極而悲"},
            {q: "「去國懷鄉」中的「去國」古義是指甚麼？", options: ["離開自己的祖國", "離開京城（國都）", "前往外國旅遊留學", "國家滅亡四處逃亡"], ans: 1, correctText: "離開京城（國都）"},
            {q: "「憂讒畏譏」中「讒」與「譏」的意思分別是甚麼？", options: ["讚美稱頌與熱情鼓勵", "法律懲罰與嚴厲審判", "作戰指揮與策略討論", "說壞話誹謗與譏諷挑剔"], ans: 3, correctText: "說壞話誹謗與譏諷挑剔"},

        ];

        let playerName = "";
        let currentQuestions = [];
        let currentIndex = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let userAnswersHistory = [];

        let startTime = null;
        let timerInterval = null;
        let finalElapsedSeconds = 0;

        function shuffleArray(array) {
            let arr = array.slice();
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                let temp = arr[i];
                arr[i] = arr[j];
                arr[j] = temp;
            }
            return arr;
        }

        function prepareQuestions(bank, count) {
            if (!Array.isArray(bank) || bank.length === 0) return [];
            let shuffledBank = shuffleArray(bank);
            let selected = shuffledBank.slice(0, Math.min(count, shuffledBank.length));
            
            return selected.map(item => {
                let originalOpts = item.options.slice();
                let ansIndex = (typeof item.ans === 'number' && item.ans >= 0 && item.ans < originalOpts.length) ? item.ans : 0;
                let correctText = item.correctText || originalOpts[ansIndex];
                let randomizedOpts = shuffleArray(originalOpts);
                let newAnsIdx = randomizedOpts.indexOf(correctText);
                return {
                    q: item.q,
                    options: randomizedOpts,
                    ans: newAnsIdx,
                    correctText: correctText
                };
            });
        }

        function startBattle() {
            const nameInput = document.getElementById("player-name");
            const alertBox = document.getElementById("name-alert");
            playerName = nameInput ? nameInput.value.trim() : "";

            if (!playerName) {
                if (alertBox) alertBox.textContent = "請先輸入姓名。";
                if (nameInput) nameInput.focus();
                return;
            }
            if (alertBox) alertBox.textContent = "";

            currentQuestions = prepareQuestions(masterBank, 30);

            if (!currentQuestions || currentQuestions.length === 0) {
                alert("題目準備失敗，請重新整理頁面！");
                return;
            }

            currentIndex = 0;
            correctCount = 0;
            wrongCount = 0;
            userAnswersHistory = [];

            const pStatus = document.getElementById("player-status-name");
            if (pStatus) pStatus.textContent = playerName;

            const homeScreen = document.getElementById("screen-home");
            const quizScreen = document.getElementById("screen-quiz");
            if (homeScreen) homeScreen.classList.remove("active");
            if (quizScreen) quizScreen.classList.add("active");

            startTime = Date.now();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);
            updateTimer();

            loadQuizStep();
        }

        function updateTimer() {
            let elapsedSec = Math.floor((Date.now() - startTime) / 1000);
            let mins = Math.floor(elapsedSec / 60);
            let secs = elapsedSec % 60;
            const timerElem = document.getElementById("timer-display");
            if (timerElem) {
                timerElem.textContent = `用時：${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }
        }

        function loadQuizStep() {
            if (currentIndex >= currentQuestions.length || wrongCount >= 5) {
                endBattle();
                return;
            }

            const qObj = currentQuestions[currentIndex];
            const qCounter = document.getElementById("question-counter");
            const qContent = document.getElementById("ui-question-content");
            const wrongSpan = document.getElementById("wrong-count");
            const remainSpan = document.getElementById("ques-remaining");
            const playerHp = document.getElementById("player-hp");
            const monsterHp = document.getElementById("monster-hp");
            const optionsBox = document.getElementById("ui-options-container");

            if (!qContent || !optionsBox) return;

            if (qCounter) qCounter.textContent = `題目 ${currentIndex + 1} / ${currentQuestions.length}`;
            qContent.textContent = qObj.q;
            if (wrongSpan) wrongSpan.textContent = wrongCount;
            if (remainSpan) remainSpan.textContent = currentQuestions.length - currentIndex;

            if (playerHp) playerHp.style.width = `${Math.max(0, 100 - (wrongCount * 20))}%`;
            if (monsterHp) monsterHp.style.width = `${Math.max(0, 100 - ((currentIndex / currentQuestions.length) * 100))}%`;

            optionsBox.innerHTML = "";
            qObj.options.forEach((opt, idx) => {
                let btn = document.createElement("button");
                btn.className = "option-btn";
                btn.type = "button";
                btn.textContent = `${String.fromCharCode(65 + idx)}. ${opt}`;
                btn.onclick = function() { handleAnswer(idx, qObj); };
                optionsBox.appendChild(btn);
            });
        }

        function handleAnswer(selectedIdx, qObj) {
            let isCorrect = (selectedIdx === qObj.ans);
            if (isCorrect) {
                correctCount++;
            } else {
                wrongCount++;
            }

            userAnswersHistory.push({
                question: qObj.q,
                selected: selectedIdx,
                options: qObj.options,
                correctIdx: qObj.ans,
                isCorrect: isCorrect,
                correctText: qObj.correctText
            });

            currentIndex++;
            loadQuizStep();
        }

        function endBattle() {
            if (timerInterval) clearInterval(timerInterval);
            finalElapsedSeconds = Math.floor((Date.now() - startTime) / 1000);

            const quizScreen = document.getElementById("screen-quiz");
            const resultScreen = document.getElementById("screen-result");
            if (quizScreen) quizScreen.classList.remove("active");
            if (resultScreen) resultScreen.classList.add("active");

            let mins = Math.floor(finalElapsedSeconds / 60);
            let secs = finalElapsedSeconds % 60;
            let totalQuestions = currentQuestions.length;

            const avatar = document.getElementById("result-avatar");
            const title = document.getElementById("result-title");
            const desc = document.getElementById("result-desc");
            const scoreText = document.getElementById("result-score-text");
            const timeText = document.getElementById("result-time-text");
            const reviewBox = document.getElementById("review-list");

            if (wrongCount >= 5) {
                if (avatar) avatar.textContent = "🛌";
                if (title) {
                    title.textContent = "中道崩殂";
                    title.className = "result-title fail";
                }
                if (desc) desc.textContent = "你未能堅持到最後，被怪物擊敗了。";
            } else if (wrongCount > 0) {
                if (avatar) avatar.textContent = "🥵";
                if (title) {
                    title.textContent = "歷盡艱辛";
                    title.className = "result-title hard";
                }
                if (desc) desc.textContent = "你歷盡艱辛，以滿身傷痕為代價擊敗了怪物。";
            } else {
                if (avatar) avatar.textContent = "😎";
                if (title) {
                    title.textContent = "易如反掌";
                    title.className = "result-title easy";
                }
                if (desc) desc.textContent = "你大臂一揮，怪物頓時灰飛煙滅。";
            }

            if (scoreText) scoreText.textContent = `答對題數：${correctCount} / ${totalQuestions} 題`;
            if (timeText) timeText.textContent = `總用時：${mins} 分 ${secs} 秒`;

            if (reviewBox) {
                reviewBox.innerHTML = "";
                userAnswersHistory.forEach((ans, idx) => {
                    let item = document.createElement("div");
                    item.className = `review-item ${ans.isCorrect ? 'correct' : 'incorrect'}`;
                    
                    let userOptStr = ans.selected !== null ? `${String.fromCharCode(65 + ans.selected)}. ${ans.options[ans.selected]}` : "未作答";
                    let correctOptStr = `${String.fromCharCode(65 + ans.correctIdx)}. ${ans.correctText}`;

                    item.innerHTML = `<strong>Q${idx + 1}: ${ans.question}</strong><br>` +
                                     `您的選擇：<span style="color:${ans.isCorrect?'var(--success-color)':'var(--accent-color)'};">${userOptStr}</span><br>` +
                                     `正確答案：<span style="color:var(--success-color);">${correctOptStr}</span>`;
                    reviewBox.appendChild(item);
                });
            }
        }

        function goToHome() {
            const resultScreen = document.getElementById("screen-result");
            const homeScreen = document.getElementById("screen-home");
            if (resultScreen) resultScreen.classList.remove("active");
            if (homeScreen) homeScreen.classList.add("active");
            const nameInput = document.getElementById("player-name");
            if (nameInput) {
                nameInput.value = "";
                nameInput.focus();
            }
        }
    </script>
